<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Playwright 워커별 인증 상태 재사용 흐름</title>
  <desc id="desc">각 워커가 별도 계정으로 한 번 로그인해 storageState JSON을 만들고, 워커가 실행하는 각 테스트는 이 상태로 새로운 브라우저 컨텍스트를 만든다.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1e293b" flood-opacity=".08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6488a8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#65a17c"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 750; }
      .section { font-size: 17px; font-weight: 750; letter-spacing: .02em; }
      .worker { font-size: 25px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 600; }
      .sub { font-size: 14px; font-weight: 500; fill: #64748b; }
      .card { filter: url(#shadow); stroke-width: 2; }
      .arrow { fill: none; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#fbfaf7"/>
  <text class="title" x="600" y="58" text-anchor="middle">로그인은 워커에서 한 번, 브라우저 상태는 테스트마다 새로</text>

  <rect x="70" y="96" width="1060" height="320" rx="26" fill="#edf3f8" stroke="#8bafc7" stroke-width="2"/>
  <text class="section" x="98" y="130" fill="#3e718f">워커 범위에서 재사용</text>

  <rect class="card" x="110" y="158" width="420" height="216" rx="22" fill="#ffffff" stroke="#79a1bd"/>
  <text class="worker" x="140" y="202">Worker 0</text>
  <rect x="140" y="226" width="140" height="50" rx="14" fill="#e9f3ee" stroke="#91bda1" stroke-width="2"/>
  <text class="label" x="210" y="257" text-anchor="middle">looper1 계정</text>
  <path class="arrow" d="M292 251 H346" stroke="#6488a8" marker-end="url(#arrow-blue)"/>
  <rect x="360" y="226" width="136" height="50" rx="14" fill="#edf3f8" stroke="#8bafc7" stroke-width="2"/>
  <text class="label" x="428" y="257" text-anchor="middle">UI 로그인</text>
  <path class="arrow" d="M428 288 V315" stroke="#6488a8" marker-end="url(#arrow-blue)"/>
  <rect x="316" y="320" width="224" height="40" rx="12" fill="#d7e7f2"/>
  <text class="body" x="428" y="346" text-anchor="middle">worker-0.json</text>

  <rect class="card" x="670" y="158" width="420" height="216" rx="22" fill="#ffffff" stroke="#9a79a5"/>
  <text class="worker" x="700" y="202">Worker 1</text>
  <rect x="700" y="226" width="140" height="50" rx="14" fill="#f4edf6" stroke="#b68ac0" stroke-width="2"/>
  <text class="label" x="770" y="257" text-anchor="middle">looper2 계정</text>
  <path class="arrow" d="M852 251 H906" stroke="#8f6a99" marker-end="url(#arrow-blue)"/>
  <rect x="920" y="226" width="136" height="50" rx="14" fill="#f4edf6" stroke="#b68ac0" stroke-width="2"/>
  <text class="label" x="988" y="257" text-anchor="middle">UI 로그인</text>
  <path class="arrow" d="M988 288 V315" stroke="#8f6a99" marker-end="url(#arrow-blue)"/>
  <rect x="876" y="320" width="224" height="40" rx="12" fill="#e8d9eb"/>
  <text class="body" x="988" y="346" text-anchor="middle">worker-1.json</text>

  <path class="arrow" d="M428 374 V464" stroke="#65a17c" marker-end="url(#arrow-green)"/>
  <path class="arrow" d="M988 374 V464" stroke="#65a17c" marker-end="url(#arrow-green)"/>

  <rect x="70" y="456" width="1060" height="286" rx="26" fill="#e9f3ee" stroke="#91bda1" stroke-width="2"/>
  <text class="section" x="98" y="492" fill="#3f7760">테스트 범위에서 격리</text>

  <rect class="card" x="110" y="522" width="230" height="150" rx="20" fill="#ffffff" stroke="#91bda1"/>
  <text class="label" x="225" y="560" text-anchor="middle">Test A</text>
  <rect x="140" y="580" width="170" height="46" rx="13" fill="#f4faf6" stroke="#b8d2c1" stroke-width="2"/>
  <text class="body" x="225" y="609" text-anchor="middle">새 BrowserContext</text>
  <text class="sub" x="225" y="650" text-anchor="middle">worker-0.json으로 초기화</text>

  <rect class="card" x="370" y="522" width="230" height="150" rx="20" fill="#ffffff" stroke="#91bda1"/>
  <text class="label" x="485" y="560" text-anchor="middle">Test B</text>
  <rect x="400" y="580" width="170" height="46" rx="13" fill="#f4faf6" stroke="#b8d2c1" stroke-width="2"/>
  <text class="body" x="485" y="609" text-anchor="middle">새 BrowserContext</text>
  <text class="sub" x="485" y="650" text-anchor="middle">worker-0.json으로 초기화</text>

  <rect class="card" x="670" y="522" width="230" height="150" rx="20" fill="#ffffff" stroke="#91bda1"/>
  <text class="label" x="785" y="560" text-anchor="middle">Test C</text>
  <rect x="700" y="580" width="170" height="46" rx="13" fill="#f4faf6" stroke="#b8d2c1" stroke-width="2"/>
  <text class="body" x="785" y="609" text-anchor="middle">새 BrowserContext</text>
  <text class="sub" x="785" y="650" text-anchor="middle">worker-1.json으로 초기화</text>

  <rect class="card" x="930" y="522" width="160" height="150" rx="20" fill="#ffffff" stroke="#91bda1"/>
  <text class="label" x="1010" y="560" text-anchor="middle">Test D</text>
  <rect x="950" y="580" width="120" height="46" rx="13" fill="#f4faf6" stroke="#b8d2c1" stroke-width="2"/>
  <text class="body" x="1010" y="599" text-anchor="middle">새 Context</text>
  <text class="sub" x="1010" y="619" text-anchor="middle">독립된 저장소</text>
  <text class="sub" x="1010" y="650" text-anchor="middle">worker-1.json 사용</text>

  <rect x="230" y="770" width="740" height="30" rx="15" fill="#f1eee7"/>
  <text class="sub" x="600" y="790" text-anchor="middle">클라이언트 저장소는 테스트마다 분리 · 서버 데이터는 워커별 계정으로 분리</text>
</svg>
